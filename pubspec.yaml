name: grind
description: "Grind — an encouraging productivity app with calendar, reminders, goals and a companion (Pip). iOS + web."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  drift: ^2.31.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.4
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  rrule: ^0.2.18
  share_plus: ^12.0.2
  sqlite3_flutter_libs: ^0.5.42
  timezone: ^0.10.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-400.ttf
          weight: 400
        - asset: assets/fonts/Heebo-500.ttf
          weight: 500
        - asset: assets/fonts/Heebo-700.ttf
          weight: 700
