name: Deploy web

# Deploys main to GitHub Pages (no secrets needed).
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
# Served at https://<owner>.github.io/Grind/ so base href is /Grind/.
# TODO(#49): per-PR previews need a host with preview URLs (Cloudflare Pages,
# Vercel, Firebase) and therefore secrets; Pages cannot do them without secrets.
# TODO(#49): custom domain would change --base-href to /.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Through env, not interpolated into the script text.
      GOOGLE_CLIENT_ID_WEB: ${{ vars.GOOGLE_CLIENT_ID_WEB }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # GOOGLE_CLIENT_ID_WEB is a repository variable (Settings > Secrets and
      # variables > Actions > Variables); without it Google Calendar stays
      # disconnected with a setup hint in the app.
      - run: flutter build web --release --no-web-resources-cdn --base-href /Grind/ --dart-define=GOOGLE_CLIENT_ID_WEB="$GOOGLE_CLIENT_ID_WEB"
      # GitHub Pages is a static host, so a deep link like `/Grind/today`
      # returns HTTP 404 — there is no `/Grind/today/index.html` on disk.
      # `web/404.html` + `web/spa_redirect.js` already give the right
      # in-browser experience via a JS redirect (PR #134), but the HTTP
      # response is still 404, which the cloud QA sweep rightly flags
      # (#162) and which also breaks crawlers, link previews and caches.
      #
      # Fix: stamp a copy of `build/web/index.html` into `build/web/<route>/`
      # for every static top-level route. Pages then serves 200 for them,
      # and Flutter boots directly at the right path because the `<base
      # href="/Grind/">` inside the stamped index normalises window.location
      # back to `/Grind/` while go_router reads the deep path. The sibling
      # `web/404.html` fallback stays for dynamic routes (`/task/:id`,
      # `/goals/:id`) that we can't enumerate here.
      #
      # Keep this list in sync with the top-level static GoRoute paths in
      # `lib/app/router.dart`; `test/web/spa_fallback_test.dart` pins the
      # cross-reference and fails loudly if they drift.
      - name: Pre-render per-route stubs for GitHub Pages SPA routing
        run: |
          for route in today plan focus pip ask goals week highlights analytics settings review; do
            mkdir -p "build/web/$route"
            cp build/web/index.html "build/web/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job may write Pages / mint the OIDC token; the build
    # job runs third-party actions and `flutter test` with read access only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
