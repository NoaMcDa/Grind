<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Grind: a calm daily planner. Your plans stay on this device.">
  <meta name="theme-color" content="#5B3DF5">

  <!-- Content-Security-Policy. docs/privacy.md explains what the app talks to.
       'wasm-unsafe-eval' lets CanvasKit and sqlite3.wasm compile; drift's
       worker is same-origin. accounts.google.com is Google Identity Services
       (sign-in script, popup and frame); www.googleapis.com is the Calendar
       API. 'unsafe-inline' for styles only: Flutter sets inline style
       attributes. fonts.gstatic.com: CanvasKit fetches a fallback font
       (Roboto) for glyphs the bundled fonts lack; no user data is sent.
       Keep in sync with the Google calendar client. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com;
    style-src 'self' 'unsafe-inline' https://accounts.google.com;
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' blob: data: https://www.googleapis.com https://accounts.google.com https://fonts.gstatic.com;
    frame-src https://accounts.google.com;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self'">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grind">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grind</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services, used by google_sign_in on web for
       Google Calendar (#13, docs/adr/0005-google-calendar.md). -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
