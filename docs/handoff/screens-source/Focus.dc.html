<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#3A22C7}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#5B3DF5;position:relative;font-family:'DM Sans',sans-serif;color:#FFFFFF;">

  <div style="position:absolute;left:0;right:0;top:0;bottom:78px;padding:20px 20px 0 20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;">

    <div style="width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;">
      <div style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFFFFF;">Focus 2 of 4</div>
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;line-height:1.2;color:#FFFFFF;">Thesis: write related-work section</div>
      <div style="margin-top:4px;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;box-sizing:border-box;background:#FFC83D;color:#17123A;border:2.5px solid #17123A;border-radius:999px;box-shadow:3px 3px 0 #17123A;font-size:13px;font-weight:700;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>Hard mode on · 3 apps shielded</span>
      </div>
    </div>

    <div style="position:relative;width:250px;height:250px;margin-top:52px;flex-shrink:0;">
      <svg width="250" height="250" viewBox="0 0 250 250" aria-hidden="true" style="position:absolute;left:0;top:0;">
        <circle cx="125" cy="125" r="108" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="20"></circle>
        <circle cx="125" cy="125" r="108" fill="none" stroke="#FFC83D" stroke-width="20" stroke-linecap="round" stroke-dasharray="678.58" stroke-dashoffset="171" transform="rotate(-90 125 125)"></circle>
      </svg>
      <div style="position:absolute;left:87px;top:-58px;width:76px;height:76px;">
        <svg width="76" height="76" viewBox="0 0 100 100" role="img" aria-label="Pip, your companion">
          <path d="M24 58 Q12 46 15 30" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round"></path>
          <path d="M76 58 Q88 46 85 30" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round"></path>
          <circle cx="15" cy="28" r="5" fill="#FFC83D" stroke="#17123A" stroke-width="2.5"></circle>
          <circle cx="85" cy="28" r="5" fill="#FFC83D" stroke="#17123A" stroke-width="2.5"></circle>
          <path d="M50 30 Q49 22 52 16" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round"></path>
          <path d="M52 17 Q60 8 70 11 Q65 21 52 17 Z" fill="#2EC4A6" stroke="#17123A" stroke-width="2.5" stroke-linejoin="round"></path>
          <circle cx="50" cy="60" r="30" fill="#FFC83D" stroke="#17123A" stroke-width="2.5"></circle>
          <ellipse cx="40" cy="55" rx="3.8" ry="5.2" fill="#17123A"></ellipse>
          <ellipse cx="60" cy="55" rx="3.8" ry="5.2" fill="#17123A"></ellipse>
          <circle cx="41.3" cy="53" r="1.4" fill="#FFFFFF"></circle>
          <circle cx="61.3" cy="53" r="1.4" fill="#FFFFFF"></circle>
          <circle cx="32" cy="66" r="4" fill="#FF7AB0"></circle>
          <circle cx="68" cy="66" r="4" fill="#FF7AB0"></circle>
          <path d="M42 66 Q50 74 58 66" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round"></path>
        </svg>
      </div>
      <div style="position:absolute;left:0;top:0;width:250px;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:64px;line-height:1;color:#FFFFFF;letter-spacing:-.01em;">18:42</div>
        <div style="{{ subStyle }}">{{ subLabel }}</div>
      </div>
    </div>

    <div style="position:relative;margin-top:22px;width:100%;box-sizing:border-box;background:#FFFFFF;color:#17123A;border:2.5px solid #17123A;border-radius:22px;box-shadow:4px 4px 0 #17123A;padding:12px 16px;font-size:15px;line-height:1.4;font-weight:500;">
      <div style="position:absolute;left:50%;top:-9px;width:14px;height:14px;margin-left:-7px;background:#FFFFFF;border-left:2.5px solid #17123A;border-top:2.5px solid #17123A;transform:rotate(45deg);"></div>
      <span style="font-weight:700;">Pip:</span> You're past halfway. Keep going, the first draft just needs to exist.
    </div>

    <div style="margin-top:18px;display:flex;align-items:center;justify-content:center;gap:16px;">
      <button type="button" style="height:48px;padding:0 20px;background:#FFFFFF;color:#17123A;border:2.5px solid #17123A;border-radius:999px;box-shadow:3px 3px 0 #17123A;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;">+5 min</button>
      <button type="button" onClick="{{ toggle }}" aria-label="{{ btnLabel }}" title="{{ btnLabel }}" style="width:72px;height:72px;border-radius:999px;background:#FFC83D;border:2.5px solid #17123A;box-shadow:4px 4px 0 #17123A;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;">
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="#17123A" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </sc-if>
        <sc-if value="{{ running }}" hint-placeholder-val="{{ true }}">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14"></path><path d="M15 5v14"></path></svg>
        </sc-if>
      </button>
      <button type="button" style="height:48px;padding:0 22px;background:#FFFFFF;color:#17123A;border:2.5px solid #17123A;border-radius:999px;box-shadow:3px 3px 0 #17123A;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;">End</button>
    </div>

    <div role="img" aria-label="Sessions 1 and 2 done, 3 and 4 to go" style="margin-top:18px;display:flex;gap:10px;align-items:center;">
      <span style="width:12px;height:12px;border-radius:999px;background:#FFC83D;border:2px solid #17123A;box-sizing:border-box;"></span>
      <span style="width:12px;height:12px;border-radius:999px;background:#FFC83D;border:2px solid #17123A;box-sizing:border-box;"></span>
      <span style="width:12px;height:12px;border-radius:999px;background:transparent;border:2px solid #FFFFFF;box-sizing:border-box;"></span>
      <span style="width:12px;height:12px;border-radius:999px;background:transparent;border:2px solid #FFFFFF;box-sizing:border-box;"></span>
    </div>

    <div style="margin-top:18px;width:340px;display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFFFFF;">Lock Screen preview</span>
        <span style="font-size:13px;color:#FFFFFF;">Live Activity</span>
      </div>
      <div aria-label="How this session appears on your Lock Screen" style="width:340px;height:72px;box-sizing:border-box;background:#000000;border-radius:24px;padding:0 18px 0 12px;display:flex;align-items:center;gap:12px;">
        <svg width="44" height="44" viewBox="0 0 100 100" role="img" aria-label="Pip, your companion" style="flex-shrink:0;">
          <path d="M50 30 Q49 22 52 16" fill="none" stroke="#2EC4A6" stroke-width="4" stroke-linecap="round"></path>
          <path d="M52 17 Q60 8 70 11 Q65 21 52 17 Z" fill="#2EC4A6" stroke="#17123A" stroke-width="2.5" stroke-linejoin="round"></path>
          <circle cx="50" cy="60" r="30" fill="#FFC83D" stroke="#17123A" stroke-width="2.5"></circle>
          <ellipse cx="40" cy="55" rx="3.8" ry="5.2" fill="#17123A"></ellipse>
          <ellipse cx="60" cy="55" rx="3.8" ry="5.2" fill="#17123A"></ellipse>
          <circle cx="41.3" cy="53" r="1.4" fill="#FFFFFF"></circle>
          <circle cx="61.3" cy="53" r="1.4" fill="#FFFFFF"></circle>
          <circle cx="32" cy="66" r="4" fill="#FF7AB0"></circle>
          <circle cx="68" cy="66" r="4" fill="#FF7AB0"></circle>
          <path d="M42 66 Q50 74 58 66" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round"></path>
        </svg>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:12px;font-weight:700;color:#FFC83D;letter-spacing:.04em;text-transform:uppercase;">{{ liveStatus }}</span>
          <span style="font-size:15px;font-weight:500;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Thesis: write related-work section</span>
        </div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;color:#FFFFFF;flex-shrink:0;">18:42</span>
      </div>
    </div>

  </div>

  <nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:78px;box-sizing:border-box;background:#FFFFFF;border-top:2.5px solid #17123A;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 8px 0 8px;">
    <button type="button" style="background:transparent;border:0;padding:4px 8px;min-width:56px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <span>Today</span>
    </button>
    <button type="button" style="background:transparent;border:0;padding:4px 8px;min-width:56px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>Plan</span>
    </button>
    <button type="button" aria-current="page" style="background:#EDE8FF;border:0;border-radius:14px;padding:4px 12px;min-width:56px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B3DF5;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg>
      <span>Focus</span>
    </button>
    <button type="button" style="background:transparent;border:0;padding:4px 8px;min-width:56px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="14" r="7"></circle><path d="M12 7c0-2 1-3.5 3.5-4"></path><path d="M9.5 16q2.5 2 5 0"></path></svg>
      <span>Pip</span>
    </button>
    <button type="button" style="background:transparent;border:0;padding:4px 8px;min-width:56px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 10h6"></path></svg>
      <span>Ask</span>
    </button>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    const paused = !!(this.state && this.state.paused);
    return {
      paused: paused,
      running: !paused,
      btnLabel: paused ? "Resume" : "Pause",
      subLabel: paused ? "Paused" : "of 25:00",
      subStyle: paused
        ? "font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#17123A;background:#FFC83D;border:2px solid #17123A;border-radius:999px;padding:3px 12px;"
        : "font-size:16px;font-weight:500;color:#FFFFFF;",
      liveStatus: paused ? "Paused" : "Focusing",
      toggle: () => this.setState({ paused: !paused })
    };
  }
}
</script>
</body>
</html>
