<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#3A22C7}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#F5F2FF;position:relative;font-family:'DM Sans',sans-serif;color:#17123A;">

  <!-- Header -->
  <div style="padding:18px 20px 0 20px;display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <div style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:#FFFFFF;border:2.5px solid #17123A;border-radius:999px;box-sizing:border-box;font-size:13px;font-weight:700;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span>Thu, Oct 29</span>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:#2EC4A6;border:2.5px solid #17123A;border-radius:999px;box-sizing:border-box;box-shadow:2px 2px 0 #17123A;font-size:13px;font-weight:700;color:#17123A;" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        <span>{{doneCount}} of 5 done</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
        <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-0.01em;">Your day, drafted</h1>
        <p style="margin:0;font-size:13px;color:#5A5478;line-height:1.35;">Pip arranged 5 tasks around 2 classes. Drag to tweak.</p>
      </div>
      <svg width="48" height="52" viewBox="0 0 48 52" role="img" aria-label="Pip, your companion" style="flex-shrink:0;">
        <path d="M24 12 C24 7 26 4 30 2 C31 6 28 10 24 12 Z" fill="#2EC4A6" stroke="#17123A" stroke-width="2" stroke-linejoin="round"></path>
        <path d="M24 12 L24 15" stroke="#17123A" stroke-width="2" stroke-linecap="round"></path>
        <ellipse cx="24" cy="32" rx="20" ry="18" fill="#FFC83D" stroke="#17123A" stroke-width="2.5"></ellipse>
        <ellipse cx="17" cy="29" rx="2.6" ry="3.6" fill="#17123A"></ellipse>
        <ellipse cx="31" cy="29" rx="2.6" ry="3.6" fill="#17123A"></ellipse>
        <circle cx="17.9" cy="27.6" r="1" fill="#FFFFFF"></circle>
        <circle cx="31.9" cy="27.6" r="1" fill="#FFFFFF"></circle>
        <circle cx="11.5" cy="36" r="2.6" fill="#FF7AB0"></circle>
        <circle cx="36.5" cy="36" r="2.6" fill="#FF7AB0"></circle>
        <path d="M19.5 37 Q24 41 28.5 37" fill="none" stroke="#17123A" stroke-width="2.2" stroke-linecap="round"></path>
      </svg>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
      <span style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A5478;">Energy</span>
      <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;background:#5B3DF5;color:#FFFFFF;border:2px solid #17123A;border-radius:999px;box-sizing:border-box;font-size:12px;font-weight:700;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>Deep focus</span>
      <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;background:#7FC8FF;color:#17123A;border:2px solid #17123A;border-radius:999px;box-sizing:border-box;font-size:12px;font-weight:700;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 18a5 5 0 1 0-1.5-9.8A6 6 0 0 0 4 10a4 4 0 0 0 1 8z"></path></svg>Light</span>
    </div>
  </div>

  <!-- Timeline -->
  <div style="position:absolute;left:20px;right:20px;top:168px;height:488px;">
    <div style="position:relative;height:480px;margin-top:4px;">
      <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
        <div style="{{ h.labelStyle }}">{{ h.label }}</div>
        <div style="{{ h.ruleStyle }}"></div>
      </sc-for>

      <!-- Calendar: Lecture 10:00–11:30 -->
      <div style="position:absolute;left:44px;right:4px;top:98px;height:68px;box-sizing:border-box;background:#FFFFFF;border:2.5px dashed #17123A;border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:10px;">
        <div style="width:34px;height:34px;flex-shrink:0;border-radius:12px;background:#F5F2FF;border:2px solid #17123A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A5478;">From calendar</span>
          <span style="font-size:14px;font-weight:700;line-height:1.2;">Lecture: Computer Vision</span>
          <span style="font-size:12px;color:#5A5478;">10:00–11:30</span>
        </div>
      </div>

      <!-- Calendar: Seminar 14:00–15:30 -->
      <div style="position:absolute;left:44px;right:4px;top:290px;height:68px;box-sizing:border-box;background:#FFFFFF;border:2.5px dashed #17123A;border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:10px;">
        <div style="width:34px;height:34px;flex-shrink:0;border-radius:12px;background:#F5F2FF;border:2px solid #17123A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A5478;">From calendar</span>
          <span style="font-size:14px;font-weight:700;line-height:1.2;">Seminar with supervisor</span>
          <span style="font-size:12px;color:#5A5478;">14:00–15:30</span>
        </div>
      </div>

      <!-- Tasks -->
      <sc-for list="{{ tasks }}" as="item" hint-placeholder-count="5">
        <div style="{{ item.wrapStyle }}">
          <button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" aria-label="{{ item.aria }}" style="{{ item.btnStyle }}">
            <span style="{{ item.circleStyle }}">
              <sc-if value="{{ item.done }}" hint-placeholder-val="{{ true }}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
              </sc-if>
            </span>
            <span style="{{ item.textWrapStyle }}">
              <span style="{{ item.titleStyle }}">{{ item.title }}</span>
              <span style="{{ item.timeStyle }}">{{ item.time }}</span>
            </span>
          </button>
          <sc-if value="{{ item.hasFocus }}" hint-placeholder-val="{{ true }}">
            <button type="button" style="flex-shrink:0;height:44px;padding:0 12px;margin-right:8px;background:#FFC83D;color:#17123A;border:2.5px solid #17123A;border-radius:999px;box-shadow:3px 3px 0 #17123A;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#17123A" stroke="#17123A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
              Start focus
            </button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Sticky actions -->
  <div style="position:absolute;left:0;right:0;bottom:66px;padding:12px 20px 12px 20px;background:linear-gradient(to bottom, rgba(245,242,255,0) 0%, #F5F2FF 26%);display:flex;gap:10px;">
    <button type="button" style="flex:1;height:52px;background:#5B3DF5;color:#FFFFFF;border:2.5px solid #17123A;border-radius:999px;box-shadow:4px 4px 0 #17123A;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg>
      Re-plan with Pip
    </button>
    <button type="button" style="height:52px;padding:0 16px;background:#FFC83D;color:#17123A;border:2.5px solid #17123A;border-radius:999px;box-shadow:4px 4px 0 #17123A;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17123A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add task
    </button>
  </div>

  <!-- Tab bar -->
  <nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:66px;box-sizing:border-box;background:#FFFFFF;border-top:2.5px solid #17123A;display:flex;justify-content:space-around;align-items:center;padding:0 8px 4px 8px;">
    <button type="button" style="background:none;border:none;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;min-width:56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      Today
    </button>
    <button type="button" aria-current="page" style="background:#5B3DF5;border:2px solid #17123A;border-radius:16px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#FFFFFF;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;min-width:56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      Plan
    </button>
    <button type="button" style="background:none;border:none;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;min-width:56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M10 2h4"></path></svg>
      Focus
    </button>
    <button type="button" style="background:none;border:none;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;min-width:56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="14" r="8"></circle><path d="M12 6c0-2 1-3 3-4"></path><path d="M9.5 16.5q2.5 2 5 0"></path></svg>
      Pip
    </button>
    <button type="button" style="background:none;border:none;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5A5478;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;min-width:56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      Ask
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { thesis: true, lunch: true } };
  }
  toggle(id) {
    const done = Object.assign({}, this.state.done);
    done[id] = !done[id];
    this.setState({ done: done });
  }
  renderVals() {
    const H = 48;
    const done = this.state.done || {};
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const hh = 8 + i;
      hours.push({
        label: (hh < 10 ? '0' : '') + hh + ':00',
        labelStyle: 'position:absolute;left:0;width:38px;top:' + (i * H - 7) + 'px;font-size:11px;font-weight:700;color:#5A5478;line-height:14px;',
        ruleStyle: 'position:absolute;left:42px;right:0;top:' + (i * H) + 'px;height:0;border-top:1.5px solid #DCD6F2;'
      });
    }
    const defs = [
      { id: 'thesis', title: 'Thesis: write related-work section', time: '08:00–09:30', start: 8, end: 9.5, kind: 'deep', focus: true },
      { id: 'lunch', title: 'Lunch break', time: '12:00', start: 12, end: 12.5, kind: 'lunch' },
      { id: 'lab', title: 'Deep learning lab 4', time: '12:30–13:15', start: 12.5, end: 13.25, kind: 'deep' },
      { id: 'read', title: 'Read 2 papers', time: '16:00–16:45', start: 16, end: 16.75, kind: 'sky' },
      { id: 'gym', title: 'Gym', time: '17:15–18:00', start: 17.25, end: 18, kind: 'mint' }
    ];
    const bg = { deep: '#5B3DF5', sky: '#7FC8FF', mint: '#2EC4A6', lunch: '#FF7AB0' };
    let doneCount = 0;
    const tasks = defs.map((t) => {
      const isDone = !!done[t.id];
      if (isDone) doneCount++;
      const top = (t.start - 8) * H;
      const height = (t.end - t.start) * H;
      const fg = t.kind === 'deep' ? '#FFFFFF' : '#17123A';
      const tall = height >= 60;
      const isLunch = t.kind === 'lunch';
      let wrapStyle;
      if (isLunch) {
        wrapStyle = 'position:absolute;left:44px;top:' + (top - 11) + 'px;height:24px;box-sizing:border-box;background:' + bg.lunch + ';border:2px solid #17123A;border-radius:999px;box-shadow:2px 2px 0 #17123A;display:flex;align-items:center;';
      } else {
        wrapStyle = 'position:absolute;left:44px;right:4px;top:' + (top + 2) + 'px;height:' + (height - 4) + 'px;box-sizing:border-box;background:' + bg[t.kind] + ';border:2.5px solid #17123A;border-radius:' + (tall ? 22 : 16) + 'px;box-shadow:' + (tall ? '4px 4px' : '3px 3px') + ' 0 #17123A;display:flex;align-items:center;';
      }
      const btnStyle = 'flex:1;min-width:0;height:100%;background:none;border:none;color:' + fg + ';font-family:\'DM Sans\',sans-serif;text-align:left;cursor:pointer;display:flex;align-items:center;gap:' + (isLunch ? 6 : 10) + 'px;padding:0 ' + (isLunch ? '10px 0 6px' : '12px') + ';';
      const cs = isLunch ? 14 : 20;
      const circleStyle = 'width:' + cs + 'px;height:' + cs + 'px;flex-shrink:0;box-sizing:border-box;border-radius:999px;border:2px solid ' + (isDone ? '#17123A' : fg) + ';background:' + (isDone ? (t.kind === 'deep' ? '#FFC83D' : '#FFFFFF') : 'transparent') + ';display:flex;align-items:center;justify-content:center;';
      const textWrapStyle = tall
        ? 'display:flex;flex-direction:column;gap:3px;min-width:0;'
        : 'flex:1;display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;gap:8px;min-width:0;';
      const deco = isDone ? 'text-decoration:line-through;text-decoration-thickness:2px;' : '';
      const titleStyle = 'font-size:' + (isLunch ? 12 : 14) + 'px;font-weight:700;line-height:1.2;white-space:' + (tall ? 'normal' : 'nowrap') + ';overflow:hidden;text-overflow:ellipsis;' + deco;
      const timeStyle = 'font-size:' + (isLunch ? 11 : 12) + 'px;font-weight:500;white-space:nowrap;flex-shrink:0;' + deco;
      return {
        title: t.title,
        time: t.time,
        done: isDone,
        pressed: isDone ? 'true' : 'false',
        aria: t.title + ', ' + t.time + (isDone ? ', done. Tap to mark not done' : '. Tap to mark done'),
        hasFocus: !!t.focus,
        wrapStyle: wrapStyle,
        btnStyle: btnStyle,
        circleStyle: circleStyle,
        textWrapStyle: textWrapStyle,
        titleStyle: titleStyle,
        timeStyle: timeStyle,
        pick: () => this.toggle(t.id)
      };
    });
    return { hours: hours, tasks: tasks, doneCount: doneCount };
  }
}
</script>
</body>
</html>
